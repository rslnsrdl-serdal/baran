*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#14243a;font:17px/1.6 system-ui}header{background:#142c48;color:white;padding:32px 20px}main,header>div{max-width:900px;margin:auto}main{padding:18px}h1,h2,h3{line-height:1.2}nav{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0;background:#eef3f8;padding:12px 0;z-index:2}button,select{font:inherit;border:1px solid #b9c9d8;border-radius:12px;padding:10px 15px;background:white;color:#14243a;cursor:pointer}button:hover,button:focus{border-color:#087c87;background:#e1f6f4}button.primary{background:#087c87;color:white}article,section.panel{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 14px #14243a0a}small{color:#52657a}svg{width:100%;height:auto;background:#f4f8fc;border-radius:12px}input[type=range]{width:100%;accent-color:#087c87}progress{width:100%;accent-color:#087c87}label{display:block;margin:10px 0}details{margin:10px 0;padding:12px;background:#f0f5fa;border-radius:10px}summary{cursor:pointer;font-weight:bold}.options{display:grid;gap:8px}.options button{text-align:left}.good{color:#08734d}.bad{color:#a22c36}textarea{width:100%;font:inherit;padding:12px;border:1px solid #bac8d6;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}[hidden]{display:none!important}
</style><header><div><small style="color:#b9dbe5">NATURWISSENSCHAFTEN · KLASSE 8</small><h1>Physik & Chemie Lernlabor</h1><p>Verstehen. Experimentieren. Üben. Sicher erklären.</p></div></header><main><nav id="nav"></nav><div id="view"></div></main><script>
const lessons=[
['P','Sammellinsen','Eine Sammellinse ist in der Mitte dicker als am Rand. Sie bricht achsenparallele Lichtstrahlen so, dass sie sich hinter der Linse im Brennpunkt F treffen. Danach laufen sie auseinander. Die optische Achse verläuft durch die Linsenmitte. Die Brennweite f ist der Abstand zwischen Linsenmitte und Brennpunkt.','Warum verschmelzen die Strahlen nicht?','Sie kreuzen sich nur und laufen danach weiter.'],
['P','Drei Konstruktionsstrahlen','Parallelstrahl: vor der Linse parallel zur optischen Achse, danach durch den hinteren Brennpunkt. Mittelpunktstrahl: geradlinig durch die Mitte einer idealen dünnen Linse. Brennpunktstrahl: durch den vorderen Brennpunkt, danach parallel zur Achse.','Wie zeichnet man den Brennpunktstrahl?','Vom Gegenstandspunkt durch den vorderen Brennpunkt bis zur Linse, danach parallel zur Achse.'],
['P','Bildkonstruktion','Zeichne mindestens zwei Konstruktionsstrahlen von der Pfeilspitze. Ihr Schnittpunkt ist der Bildpunkt. Wiederhole dies für das Pfeilende, falls es nicht auf der Achse liegt. g ist die Gegenstandsweite, b die Bildweite, G die Gegenstandsgröße und B die Bildgröße.','Wo liegt der Bildpunkt?','Am Schnittpunkt der gebrochenen Strahlen.'],
['P','Scharfe Bilder','Die Mattscheibe muss in der Bildebene stehen. Dort treffen die Strahlen jedes Gegenstandspunkts zusammen. Davor oder dahinter entstehen Lichtflecken statt einzelner Bildpunkte.','Warum gibt es nur eine scharfe Schirmposition?','Nur in der Bildebene treffen die zu einem Gegenstandspunkt gehörenden Strahlen zusammen.'],
['P','Krümmung und Lichteinfall','Bei vergleichbaren Linsen aus gleichem Material führt stärkere Krümmung zu stärkerer Brechung und kürzerer Brennweite. Schräg einfallende parallele Strahlen treffen sich näherungsweise seitlich versetzt in der Brennebene.','Was passiert bei stärkerer Krümmung?','Die Brennweite wird kürzer.'],
['C','Metalle und Metalloxide','Metalle besitzen häufig metallischen Glanz, gute Wärme- und elektrische Leitfähigkeit und sind verformbar. Kupfer ist kupferrot, verformbar und nicht ferromagnetisch. Malachit ist ein grünes, sprödes Kupfererz. Bei der Reaktion eines Metalls mit Sauerstoff entsteht ein Metalloxid.','Was unterscheidet Kupfer von Malachit?','Kupfer glänzt metallisch, leitet Wärme gut und ist verformbar.'],
['C','Edel und unedel','Die Reaktivitätsreihe im Unterricht lautet: Magnesium, Aluminium, Zink, Eisen, Kupfer, Silber, Gold. Von links nach rechts nimmt die Sauerstoffaffinität im Schulmodell ab. Gold findet man daher auch elementar, Eisen meist gebunden in Erzen.','Warum findet man Gold elementar?','Es reagiert vergleichsweise wenig mit Sauerstoff.'],
['C','Oxidation, Reduktion und Redox','Im Sauerstoffmodell bedeutet Oxidation Sauerstoffaufnahme, Reduktion Sauerstoffabgabe. Beide Vorgänge laufen bei einer Sauerstoffübertragung gleichzeitig ab. Der Sauerstoffdonator gibt Sauerstoff ab, der Akzeptor nimmt ihn auf.','Wer ist bei Kupferoxid + Zink der Akzeptor?','Zink nimmt Sauerstoff auf und wird oxidiert.'],
['C','Metallgewinnung und Wortgleichungen','Ein unedleres Metall kann unter geeigneten Bedingungen einem Oxid eines edleren Metalls Sauerstoff entziehen. Kupferoxid (s) + Zink (s) → Kupfer (s) + Zinkoxid (s). Die Reaktion ist exotherm. Silberoxid kann beim Erhitzen zu Silber und Sauerstoff zerfallen.','Kann Kupfer Zinkoxid reduzieren?','Nein, Kupfer ist edler als Zink.'],
['C','Ötzi und Kupfergewinnung','Beim Erhitzen von Malachit entsteht unter anderem schwarzes Kupferoxid. Kohlenstoff kann diesem Sauerstoff entziehen: Kupferoxid + Kohlenstoff → Kupfer + Kohlenstoffdioxid (vereinfachtes Unterrichtsmodell). Kalkwasser wird durch CO₂ trüb, weil Calciumcarbonat ausfällt.','Welche Beobachtungen sprechen für die Reaktion?','Gasentwicklung, Kalkwassertrübung und kupferfarbener Rückstand.'],
['C','Energie und Aluminium','Exotherme Reaktionen geben Energie ab; endotherme benötigen netto Energiezufuhr. Aluminium bindet Sauerstoff sehr stark und wird industriell durch Schmelzflusselektrolyse gewonnen. Beim Thermitverfahren reduziert Aluminium Eisenoxid; dabei wird viel Wärme frei. Nur theoretisch lernen, nicht selbst ausprobieren.','Warum wurde Aluminium erst viel später gewonnen?','Sein Oxid ist sehr stabil; die industrielle Gewinnung benötigt Elektrolyse.']
];
const bank=[
['P','Wo treffen sich achsenparallele Strahlen?','Im Brennpunkt','In der Linsenmitte','Immer auf dem Schirm','Im Brennpunkt kreuzen sich die Strahlen.'],
['P','Was bedeutet f?','Brennweite','Bildgröße','Gegenstandsweite','f ist der Abstand der Linse zum Brennpunkt.'],
['P','Wie verläuft der Mittelpunktstrahl?','Geradlinig durch die Linsenmitte','Immer parallel','Immer durch F','Im Modell der dünnen Linse ändert er seine Richtung nicht.'],
['P','Wie verläuft ein Parallelstrahl hinter der Linse?','Durch den hinteren Brennpunkt','Durch den vorderen Brennpunkt','Unverändert parallel','Die Sammellinse lenkt ihn zum hinteren F.'],
['P','Wie verläuft ein Brennpunktstrahl hinter der Linse?','Parallel zur optischen Achse','Zurück zum Gegenstand','Senkrecht zur Achse','Der vordere Brennpunktstrahl wird parallel.'],
['P','Wo steht die Mattscheibe für ein scharfes Bild?','In der Bildebene','Immer bei F','Direkt an der Linse','Die Strahlen jedes Objektpunkts treffen dort zusammen.'],
['P','Stärkere Krümmung bei sonst gleicher Linse?','Kürzere Brennweite','Längere Brennweite','Keine Änderung','Stärkere Brechung führt zu kürzerer Brennweite.'],
['P','Was bezeichnet g?','Gegenstandsweite','Bildweite','Brennweite','Abstand Gegenstand–Linse.'],
['P','Was bezeichnet B?','Bildgröße','Bildweite','Brennweite','Großes B bezeichnet die Bildgröße.'],
['P','Bei schrägem parallelem Lichteinfall liegt der Treffpunkt näherungsweise …','Seitlich versetzt in der Brennebene','Immer in der Linsenmitte','Vor der Linse','Die Einfallsrichtung verschiebt den Treffpunkt.'],
['P','Warum wird das Bild außerhalb der Bildebene unscharf?','Die Strahlen bilden Lichtflecken','Das Licht verschwindet','Die Linse wird undurchsichtig','Die Strahlen eines Punktes treffen nicht auf einen einzigen Punkt des Schirms.'],
['P','Was ist bei g > 2f richtig? (Vertiefung)','Reelles, umgekehrtes, kleineres Bild','Aufrechtes größeres Bild','Kein Bild','Dies folgt aus der Strahlenkonstruktion.'],
['C','Oxidation im Sauerstoffmodell?','Sauerstoffaufnahme','Sauerstoffabgabe','Schmelzen','Oxidation bedeutet hier Sauerstoffaufnahme.'],
['C','Reduktion im Sauerstoffmodell?','Sauerstoffabgabe','Sauerstoffaufnahme','Verdampfen','Reduktion bedeutet hier Sauerstoffabgabe.'],
['C','Warum heißt es Redoxreaktion?','Oxidation und Reduktion laufen gleichzeitig ab','Nur Oxidation läuft ab','Es entsteht immer Wasser','Sauerstoff wird von einem Stoff auf einen anderen übertragen.'],
['C','Welches Metall ist unedler als Kupfer?','Zink','Silber','Gold','Zink steht weiter oben in der Reihe.'],
['C','Zinkoxid + Kupfer?','Keine entsprechende Sauerstoffübertragung','Zink + Kupferoxid','Gold + Wasser','Kupfer bindet Sauerstoff weniger stark als Zink.'],
['C','Kupferoxid + Zink ergibt …','Kupfer + Zinkoxid','Zink + Kupfer','Kupferoxid + Wasser','Zink übernimmt den Sauerstoff.'],
['C','Wer ist dabei Sauerstoffdonator?','Kupferoxid','Zink','Kupfer','Kupferoxid gibt Sauerstoff ab.'],
['C','Wer ist dabei Sauerstoffakzeptor?','Zink','Kupferoxid','Kupfer','Zink nimmt Sauerstoff auf.'],
['C','Kupferoxid + Kohlenstoff (CO₂-Modell)?','Kupfer + Kohlenstoffdioxid','Kupfer + Kohle','Kupfer + Wasser','Kohlenstoff übernimmt Sauerstoff.'],
['C','Silberoxid beim Erhitzen?','Silber + Sauerstoff','Nur Silber','Silber + Wasser','Sauerstoff wird freigesetzt.'],
['C','Kalkwasser wird trüb durch …','Kohlenstoffdioxid','Sauerstoff','Stickstoff','Calciumcarbonat fällt aus.'],
['C','Welche Eigenschaft hat Kupfer?','Gut verformbar','Grün und spröde','Ferromagnetisch','Kupfer ist ein gut verformbares Metall.'],
['C','Welche Eigenschaft hat Malachit?','Grün und spröde','Metallisch glänzend und gut verformbar','Flüssig bei Raumtemperatur','Malachit ist ein Mineral.'],
['C','Exotherm bedeutet …','Energieabgabe','Netto-Energieaufnahme','Keine Energieänderung','Energie wird an die Umgebung abgegeben.'],
['C','Wie gewinnt man Aluminium industriell?','Schmelzflusselektrolyse','Einfaches Erhitzen im Lagerfeuer','Filtration','Aluminiumoxid ist sehr stabil.'],
['C','Welches Metall reagiert im Schulmodell stärker mit Sauerstoff?','Magnesium','Kupfer','Gold','Magnesium ist sehr unedel.'],
['C','Eisenoxid + Zink: erwartete Produkte?','Eisen + Zinkoxid','Zink + Eisenoxid','Keine Sauerstoffübertragung','Zink ist unedler als Eisen.'],
['C','Magnesiumoxid + Aluminium?','Keine entsprechende Sauerstoffübertragung','Magnesium + Aluminiumoxid','Silber + Sauerstoff','Magnesium steht vor Aluminium.']
];
const $=id=>document.getElementById(id);let state={};try{state=JSON.parse(localStorage.getItem('labor8v1')||'{}')}catch(e){};state.done=state.done||{};state.answers=state.answers||{};function save(){try{localStorage.setItem('labor8v1',JSON.stringify(state))}catch(e){}}
const tabs=['Start','Physik','Chemie','Optik-Labor','Redox-Labor','Training','Fehlertraining','Prüfung'];$('nav').innerHTML=tabs.map(t=>'<button onclick="show(this.textContent)">'+t+'</button>').join('');
function show(t){window.scrollTo(0,0);if(t==='Start'){let n=Object.keys(state.done).length;let a=Object.values(state.answers);$('view').innerHTML='<article><h2>Dein Lernweg</h2><p>Heute: 5 Minuten Wiederholung, 10 Minuten Lernen, 10 Minuten Training, 5 Minuten Fehlerkorrektur.</p><p>'+n+' / '+lessons.length+' Lektionen abgeschlossen</p><progress max="'+lessons.length+'" value="'+n+'"></progress><p>'+a.filter(Boolean).length+' / '+bank.length+' Fragen zuletzt richtig beantwortet.</p><button class="primary" onclick="show(\'Physik\')">Lernen starten</button><p><small>Fortschritt bleibt in diesem Browser. Keine Anmeldung, keine Übertragung persönlicher Daten.</small></p></article>';return}if(t==='Physik'||t==='Chemie'){$('view').innerHTML=lessons.map((l,i)=>l[0]===t[0]?'<article><small>LEKTION '+(i+1)+'</small><h2>'+l[1]+'</h2><p>'+l[2]+'</p><details><summary>Erkläre selbst: '+l[3]+'</summary>'+l[4]+'</details><button onclick="state.done['+i+']=true;save();this.textContent=\'✓ Gelernt\'">'+(state.done[i]?'✓ Gelernt':'Als gelernt markieren')+'</button></article>':'').join('');return}if(t==='Optik-Labor'){optik();return}if(t==='Redox-Labor'){redox();return}if(t==='Prüfung'){exam();return}quiz(t==='Fehlertraining')}
function optik(){$('view').innerHTML='<article><h2>Optik-Labor</h2><p>Verändere g und f. Beobachte die drei Strahlen und den Bildpunkt. Die Darstellung verwendet das Modell einer dünnen Linse.</p><svg id="rays" viewBox="0 0 640 320"></svg><label>Gegenstandsweite g: <span id="gv"></span><input id="g" type="range" min="90" max="260" value="220" oninput="draw()"></label><label>Brennweite f: <span id="fv"></span><input id="f" type="range" min="30" max="80" value="65" oninput="draw()"></label><p id="result"></p><p><span style="color:#b83232">Rot: Parallelstrahl</span> · <span style="color:#08734d">Grün: Mittelpunktstrahl</span> · <span style="color:#a05b00">Orange: Brennpunktstrahl</span></p><details><summary>Auftrag: Stelle ein gleich großes Bild ein.</summary>Wähle g = 2f. Das Bild liegt bei b = 2f.</details><details><summary>Auftrag: Wie verändert sich das Bild bei kleinerem g?</summary>Bei g > f wächst die Bildweite und das Bild wird größer. Die Formel ist eine zusätzliche Vertiefung.</details></article>';draw()}
function draw(){let g=+$('g').value,f=+$('f').value,b=g*f/(g-f),m=b/g,k=Math.min(1,270/Math.max(g,b),115/(40*m)),x=320,y=150,h=40*k,G=g*k,F=f*k,B=b*k,H=h*m;let line=(a,c,d,e,col,w=2)=>'<line x1="'+a+'" y1="'+c+'" x2="'+d+'" y2="'+e+'" stroke="'+col+'" stroke-width="'+w+'"/>';let arrow=(a,c,d)=>line(a,c,a,d,'#14243a',4)+'<path d="M'+(a-6)+' '+(d+(d<c?10:-10))+' L'+a+' '+d+' L'+(a+6)+' '+(d+(d<c?10:-10))+'" fill="none" stroke="#14243a" stroke-width="3"/>';let s=line(10,y,630,y,'#8193a6',1)+'<path d="M320 12 Q280 150 320 288 Q360 150 320 12Z" fill="#b9dce9" fill-opacity=".5" stroke="#4387a8"/>';for(let v of [x-F,x+F])s+='<circle cx="'+v+'" cy="'+y+'" r="4"/><text x="'+v+'" y="170" text-anchor="middle">F</text>';s+=arrow(x-G,y,y-h)+arrow(x+B,y,y+H)+line(x-G,y-h,x,y-h,'#b83232')+line(x,y-h,x+B,y+H,'#b83232')+line(x-G,y-h,x+B,y+H,'#08734d')+line(x-G,y-h,x,y+H,'#a05b00')+line(x,y+H,x+B,y+H,'#a05b00');$('rays').innerHTML=s;$('gv').textContent=g+' mm';$('fv').textContent=f+' mm';$('result').textContent='Bildweite: '+b.toFixed(1)+' mm · Reelles, umgekehrtes, '+(Math.abs(m-1)<.001?'gleich großes':m>1?'vergrößertes':'verkleinertes')+' Bild.'}
const metals=['Magnesium','Aluminium','Zink','Eisen','Kupfer','Silber','Gold'];function redox(){$('view').innerHTML='<article><h2>Redox-Labor</h2><p>Reihe: '+metals.join(' → ')+' (abnehmende Sauerstoffaffinität im Schulmodell).</p><label>Metalloxid <select id="ox">'+metals.slice(0,6).map((m,i)=>'<option value="'+i+'" '+(i===4?'selected':'')+'>'+m+'oxid</option>').join('')+'</select></label><label>Hilfsstoff <select id="met">'+metals.map((m,i)=>'<option value="'+i+'" '+(i===2?'selected':'')+'>'+m+'</option>').join('')+'</select></label><p>Sage zuerst voraus: Wird Sauerstoff übertragen?</p><button onclick="react(true)">Ja</button> <button onclick="react(false)">Nein</button><div id="reaction" aria-live="polite"></div><small>Qualitatives Modell; keine Versuchsanleitung. Eigenständige thermische Zersetzung wird hier nicht simuliert.</small></article>'}
function react(guess){let o=+$('ox').value,m=+$('met').value,yes=m<o;let a=metals[o],b=metals[m];$('reaction').innerHTML='<h3 class="'+(guess===yes?'good':'bad')+'">'+(guess===yes?'Richtig!':'Überlege noch einmal.')+'</h3><svg viewBox="0 0 400 130"><rect x="15" y="25" width="145" height="70" rx="12" fill="#c6d9e9"/><rect x="240" y="25" width="145" height="70" rx="12" fill="#d9e9dd"/><text x="87" y="65" text-anchor="middle">'+(yes?a:a+'oxid')+'</text><text x="312" y="65" text-anchor="middle">'+(yes?b+'oxid':b)+'</text><circle cx="'+(yes?270:45)+'" cy="38" r="13" fill="#c43b3b"/><text x="'+(yes?270:45)+'" y="43" fill="white" text-anchor="middle">O</text>'+(yes?'<text x="200" y="65" text-anchor="middle">O →</text>':'')+'</svg><p>'+(yes?a+'oxid + '+b+' → '+a+' + '+b+'oxid. '+a+'oxid wird reduziert; '+b+' wird oxidiert.':b+' kann '+a+'oxid nach der Reaktivitätsreihe nicht entsprechend reduzieren.')+'</p>'}
let queue=[],pos=0,score=0,locked=false;function quiz(errors){queue=bank.map((_,i)=>i).filter(i=>!errors||state.answers[i]===false).sort(()=>Math.random()-.5);pos=score=0;next()}
function next(){locked=false;if(pos>=queue.length){$('view').innerHTML='<article><h2>Training abgeschlossen</h2><p>'+score+' / '+queue.length+' richtig in dieser Runde.</p><button onclick="show(\'Fehlertraining\')">Fehler wiederholen</button> <button onclick="show(\'Start\')">Übersicht</button></article>';return}let i=queue[pos],q=bank[i],opts=[1,2,3].sort(()=>Math.random()-.5);$('view').innerHTML='<article><small>'+q[0]+' · Frage '+(pos+1)+' von '+queue.length+'</small><progress max="'+queue.length+'" value="'+pos+'"></progress><h2>'+q[1]+'</h2><div class="options">'+opts.map(j=>'<button onclick="answer('+j+',this)">'+q[j+1]+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div><button id="next" hidden onclick="pos++;next()">Weiter →</button></article>'}
function answer(j,el){if(locked)return;locked=true;let i=queue[pos],q=bank[i],ok=j===1;state.answers[i]=ok;save();if(ok)score++;el.style.borderColor=ok?'green':'red';$('feedback').innerHTML='<p class="'+(ok?'good':'bad')+'">'+(ok?'Richtig!':'Richtige Antwort: '+q[2])+ '</p><p>'+q[5]+'</p>';$('next').hidden=false}
const written=[['Zeichne eine Sammellinse mit optischer Achse, beiden Brennpunkten und drei Konstruktionsstrahlen. Beschrifte g, b, G, B und f.','Parallelstrahl → hinterer F; Mittelpunktstrahl gerade; vorderer Brennpunktstrahl → parallel. Schnittpunkt ergibt Bildpunkt.'],['Erkläre, warum nur eine Mattscheibenposition ein scharfes Bild liefert.','Nur in der Bildebene treffen alle Strahlen eines Gegenstandspunkts zusammen.'],['Erkläre den Unterschied zwischen einer stärker und einer schwächer gewölbten Sammellinse.','Bei gleichem Material und vergleichbarer Geometrie: stärkere Brechung, kürzere Brennweite.'],['Vergleiche Malachit und Kupfer anhand von drei Eigenschaften.','Malachit grün, spröde, kein metallischer Glanz; Kupfer kupferrot, verformbar, metallischer Glanz.'],['Formuliere die Wortgleichung Kupferoxid + Zink. Benenne Donator, Akzeptor, Oxidation und Reduktion.','Kupferoxid + Zink → Kupfer + Zinkoxid. Donator und reduziert: Kupferoxid. Akzeptor und oxidiert: Zink.'],['Begründe, warum Kupfer Zinkoxid nicht reduziert.','Kupfer ist edler als Zink und besitzt im Schulmodell geringere Sauerstoffaffinität.'],['Erkläre den Ötzi-Versuch und die Kalkwasserprobe.','Kupferoxid gibt Sauerstoff an Kohlenstoff ab. Kupfer und CO₂ entstehen; Calciumcarbonat trübt Kalkwasser.'],['Warum kann Aluminium Eisenoxid reduzieren? Warum ist Aluminium selbst schwer zu gewinnen?','Aluminium besitzt höhere Sauerstoffaffinität als Eisen; Aluminiumoxid ist stabil und wird industriell elektrolytisch verarbeitet.']];
function exam(){$('view').innerHTML='<article><h2>Prüfungstraining · 30 Minuten</h2><p>Bearbeite die Aufgaben ohne Notizen. Zeichne Aufgabe 1 auf Papier. Vergleiche erst danach mit den Musterlösungen. Je Aufgabe 3 Punkte: fachlich richtig, vollständig, Fachsprache. Selbstbewertung, keine offizielle Schulnote.</p>'+written.map((w,i)=>'<section><h3>Aufgabe '+(i+1)+'</h3><p>'+w[0]+'</p><textarea rows="3" placeholder="Deine Antwort"></textarea><details><summary>Musterlösung anzeigen</summary>'+w[1]+'</details></section>').join('')+'</article>'}
show('Start');
</script>
<style>header{background:linear-gradient(125deg,#142c48,#075e71)}nav button{font-size:14px}article{border:1px solid #dce6ef}.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.labgrid>div{background:#edf5fa;padding:14px;border-radius:12px}.metric{font-size:25px;font-weight:700;color:#087c87}svg text{font:13px system-ui}.task{border-left:4px solid #087c87;padding:12px;background:#edf8f7;margin:12px 0}.oxygen{animation:moveO 1.2s ease-in-out forwards}@keyframes moveO{from{transform:translateX(0)}to{transform:translateX(240px)}}@media(max-width:500px){article{padding:14px}header{padding:20px}}</style>
<script>
tabs.splice(4,0,'Lichtstrahlen','Bild & Schirm');$('nav').innerHTML=tabs.map(t=>'<button onclick="show(this.textContent)">'+t+'</button>').join('');
const originalShow=show;
show=function(t){if(t==='Lichtstrahlen'){parallelLab();return}if(t==='Bild & Schirm'||t==='Optik-Labor'){imageLab();return}if(t==='Redox-Labor'){chemLab();return}originalShow(t)};
function parallelLab(){ $('view').innerHTML='<article><h2>01 · Lichtstrahlen entdecken</h2><p>Verändere den Abstand der drei Strahlen, die Brennweite und den Einfallswinkel. Sage vorher voraus, was passiert.</p><svg id="beam" viewBox="0 0 640 340"></svg><div class="labgrid"><div><label>Strahlenabstand <b id="sepv"></b><input id="sep" type="range" min="12" max="75" value="45" oninput="beamDraw()"></label></div><div><label>Brennweite <b id="bfv"></b><input id="bf" type="range" min="65" max="200" value="130" oninput="beamDraw()"></label></div><div><label>Einfallswinkel <b id="angv"></b><input id="ang" type="range" min="-18" max="18" value="0" oninput="beamDraw()"></label></div></div><div class="task"><b>Forscherauftrag:</b> Verdopple den Strahlenabstand. Wandert der Brennpunkt?</div><details><summary>Erklärung prüfen</summary>Nein. Bei gleicher Brennweite und Einfallsrichtung bleibt der Treffpunkt im idealisierten Modell gleich. Die äußeren Strahlen werden stärker abgelenkt.</details><details><summary>Was passiert bei kürzerer Brennweite?</summary>Die Strahlen treffen sich näher an der Linse. Bei schrägem Einfall verschiebt sich der Treffpunkt seitlich in der Brennebene.</details><small>Idealisierte dünne Linse, paraxiale Näherung.</small></article>';beamDraw()}
function seg(x,y,X,Y,c,w=2){return '<line x1="'+x+'" y1="'+y+'" x2="'+X+'" y2="'+Y+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/>'}
function dot(x,y,c){return '<circle cx="'+x+'" cy="'+y+'" r="5" fill="'+c+'"/>'}
function txt(x,y,t){return '<text x="'+x+'" y="'+y+'" fill="#31465c" text-anchor="middle">'+t+'</text>'}
function lens(x,y,h){return '<path d="M'+x+' '+(y-h)+' Q'+(x-44)+' '+y+' '+x+' '+(y+h)+' Q'+(x+44)+' '+y+' '+x+' '+(y-h)+'Z" fill="#b9e3f2" fill-opacity=".7" stroke="#4387a8" stroke-width="2"/>'}
function beamDraw(){let d=+$('sep').value,f=+$('bf').value,a=+$('ang').value,m=Math.tan(a*Math.PI/180),x=300,y=170,fx=x+f,fy=y+f*m;let s=seg(10,y,630,y,'#9baabb',1)+lens(x,y,120)+seg(fx,15,fx,325,'#aab9c7',1);for(let n of [-1,0,1]){let h=n*d,ly=y+h;s+=seg(25,ly-(x-25)*m,x,ly,'#d58b13',3)+seg(x,ly,fx,fy,'#d58b13',3)+seg(fx,fy,620,fy+(620-fx)*(fy-ly)/f,'#d58b13',3)}s+=dot(fx,fy,'#c43b3b')+dot(fx,y,'#31465c')+txt(fx,fy-13,'Treffpunkt')+txt(x,320,'Sammellinse');$('beam').innerHTML=s;$('sepv').textContent=d+' mm';$('bfv').textContent=f+' mm';$('angv').textContent=a+'°'}
function imageLab(){$('view').innerHTML='<article><h2>02 · Bildkonstruktion & Mattscheibe</h2><p>Verschiebe Gegenstand, Brennweite und Schirm. Finde selbst die scharfe Bildposition.</p><svg id="im" viewBox="0 0 680 350"></svg><div class="labgrid"><div><label>Gegenstandsweite g <b id="igv"></b><input id="ig" type="range" min="45" max="260" value="210" oninput="imDraw()"></label></div><div><label>Brennweite f <b id="ifv"></b><input id="iff" type="range" min="35" max="100" value="70" oninput="imDraw()"></label></div><div><label>Schirmabstand <b id="isv"></b><input id="is" type="range" min="20" max="400" value="105" oninput="imDraw()"></label></div><div><label>Gegenstandsgröße <b id="ihv"></b><input id="ih" type="range" min="15" max="65" value="45" oninput="imDraw()"></label></div></div><label><input id="ip" type="checkbox" checked onchange="imDraw()"> Parallelstrahl (rot)</label><label><input id="ic" type="checkbox" checked onchange="imDraw()"> Mittelpunktstrahl (grün)</label><label><input id="ib" type="checkbox" checked onchange="imDraw()"> Brennpunktstrahl (orange)</label><div id="imres"></div><button onclick="focusScreen()">Schirm auf Bild einstellen</button><div class="task">Finde ein verkleinertes, ein gleich großes und ein vergrößertes Bild. Was geschieht bei g kleiner als f?</div><details><summary>Erklärung</summary>g &gt; 2f: kleiner; g = 2f: gleich groß; f &lt; g &lt; 2f: größer. Bei g &lt; f entsteht ein aufrechtes virtuelles Bild, das nicht auf einem Schirm aufgefangen werden kann. Bei g = f laufen die Strahlen parallel.</details></article>';imDraw()}
function focusScreen(){let g=+$('ig').value,f=+$('iff').value;if(g>f){$('is').value=Math.round(g*f/(g-f));imDraw()}}
function imDraw(){let g=+$('ig').value,f=+$('iff').value,h=+$('ih').value,z=+$('is').value,b=g===f?Infinity:g*f/(g-f),m=-b/g,k=Math.min(1,270/Math.max(g,z,Math.min(450,Math.abs(b))),110/Math.max(h,Math.min(180,Math.abs(h*m)))),x=330,y=175;let X=v=>x+v*k,Y=v=>y-v*k;let s=seg(10,y,670,y,'#91a2b3',1)+lens(x,y,135);for(let v of [-f,f])s+=dot(X(v),y,'#31465c')+txt(X(v),y+18,'F');let arrow=(v,H,c)=>seg(X(v),y,X(v),Y(H),c,5)+'<path d="M'+(X(v)-6)+' '+(Y(H)+(H>0?10:-10))+' L'+X(v)+' '+Y(H)+' L'+(X(v)+6)+' '+(Y(H)+(H>0?10:-10))+'" stroke="'+c+'" stroke-width="3" fill="none"/>';s+=arrow(-g,h,'#14243a')+txt(X(-g),Y(h)-12,'G');let end=Math.min(450,(670-x)/k),rays=[[h,-h/f,'#c43b3b','ip'],[0,-h/g,'#08734d','ic']];if(g!==f)rays.push([h*f/(f-g),0,'#bd790e','ib']);for(let [H,slope,c,id] of rays){if(!$ (id).checked)continue;s+=seg(X(-g),Y(h),x,Y(H),c,2)+seg(x,Y(H),X(end),Y(H+slope*end),c,2);if(b<0)s+='<line x1="'+x+'" y1="'+Y(H)+'" x2="'+X(b)+'" y2="'+Y(H+slope*b)+'" stroke="'+c+'" stroke-dasharray="5 5"/>'}if(Number.isFinite(b)&&Math.abs(b)*k<320&&Math.abs(h*m)*k<155)s+=arrow(b,h*m,'#475569')+txt(X(b),Y(h*m)+(m<0?18:-12),'B');s+=seg(X(z),20,X(z),330,'#55758e',3)+txt(X(z),15,'Schirm');let blur=Math.abs(h*(1-z/f+z/g));$('im').innerHTML=s;$('igv').textContent=g+' mm';$('ifv').textContent=f+' mm';$('isv').textContent=z+' mm';$('ihv').textContent=h+' mm';$('imres').innerHTML='<div class="labgrid"><div>Bildweite<div class="metric">'+(Number.isFinite(b)?b.toFixed(1)+' mm':'∞')+'</div></div><div>Schirm<div class="metric">'+(b>0&&Number.isFinite(b)&&blur<1?'Scharf':'Unscharf')+'</div></div></div><p>'+(b<0?'Virtuelles, aufrechtes Bild.':!Number.isFinite(b)?'Parallele austretende Strahlen.':'Reelles, umgekehrtes Bild. Abstand zur idealen Schirmposition: '+Math.abs(z-b).toFixed(1)+' mm.')+'</p>'}
function chemLab(){$('view').innerHTML='<article><h2>03 · Sauerstoff-Transferlabor</h2><p>Wähle die Stoffe, stelle eine Hypothese auf und beobachte den Sauerstofftransfer.</p><div class="labgrid"><div><label>Metalloxid<select id="cox">'+metals.slice(0,6).map((m,i)=>'<option value="'+i+'" '+(i===4?'selected':'')+'>'+m+'oxid</option>').join('')+'</select></label></div><div><label>Metall<select id="cmet">'+metals.map((m,i)=>'<option value="'+i+'" '+(i===2?'selected':'')+'>'+m+'</option>').join('')+'</select></label></div></div><svg id="chemvis" viewBox="0 0 520 230"></svg><p>Deine Hypothese:</p><button onclick="chemDraw(true)">Sauerstoff wird übertragen</button> <button onclick="chemDraw(false)">Keine Übertragung</button><div id="chemres"></div><h3>Reaktivitätsreihe</h3>'+metals.map((m,i)=>'<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:100px">'+m+'</span><span style="height:12px;background:#087c87;border-radius:8px;width:'+((7-i)*11)+'%"></span></div>').join('')+'<small>Die Balken zeigen nur die Reihenfolge, keine gemessenen Reaktionswerte. Vereinfachtes Sauerstoffmodell; kein reales Experiment.</small></article>';$('cox').onchange=$('cmet').onchange=()=>chemDraw(null);chemDraw(null)}
function chemDraw(guess){let o=+$('cox').value,m=+$('cmet').value,a=metals[o],b=metals[m],yes=m<o,run=guess!==null&&yes;let s='';for(let j=0;j<2;j++)for(let i=0;i<3;i++){s+='<circle cx="'+(65+i*42)+'" cy="'+(55+j*48)+'" r="20" fill="#b87343"/><circle cx="'+(305+i*42)+'" cy="'+(55+j*48)+'" r="20" fill="#91a8ba"/>'}for(let i=0;i<3;i++)s+='<g class="'+(run?'oxygen':'')+'"><circle cx="'+(85+i*42)+'" cy="79" r="12" fill="#d33d42"/><text x="'+(85+i*42)+'" y="84" text-anchor="middle" fill="white">O</text></g>';s+=txt(105,165,run?a:a+'oxid')+txt(345,165,run?b+'oxid':b)+txt(260,195,run?'Sauerstoffübertragung →':'Ausgangsstoffe');$('chemvis').innerHTML=s;$('chemres').innerHTML=guess===null?'':'<h3 class="'+(guess===yes?'good':'bad')+'">'+(guess===yes?'Richtig vorhergesagt!':'Vergleiche die Reaktivitätsreihe.')+'</h3><p>'+(yes?a+'oxid + '+b+' → '+a+' + '+b+'oxid':'Keine entsprechende Sauerstoffübertragung.')+'</p>'+(yes?'<div class="labgrid"><div><b>Reduktion</b><p>'+a+'oxid gibt Sauerstoff ab (Donator).</p></div><div><b>Oxidation</b><p>'+b+' nimmt Sauerstoff auf (Akzeptor).</p></div></div>':'<p>Das gewählte Metall ist nicht unedler als das Metall im Oxid.</p>')}
show('Start');
</script></html>
